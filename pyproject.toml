[project]
name = "3pshc"
version = "0.3.0"
description = "3P Shutter Control — управление проекторами Panasonic по LAN с OSC из Resolume Arena"
requires-python = ">=3.9"
dependencies = [
    "dearpygui>=1.11,<3.0",
    "oscpy>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
